name: BreatheWise AI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit, Integration, and Security tests with coverage
        run: npm run test:coverage

      - name: Dependency vulnerability audit
        run: npm run audit

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-End & Accessibility (axe-core WCAG 2.2 AA) tests
        run: npx playwright test tests/e2e/breathewise.spec.ts tests/accessibility/a11y.spec.ts --project=chromium
